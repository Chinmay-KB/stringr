name: Bug report
description: Report a bug, regression, or unexpected behavior in stringr.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Share the smallest example that reproduces the issue.
      placeholder: |
        import 'package:stringr/stringr.dart';

        void main() {
          print('example'.someMethod());
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: stringr version
      placeholder: 1.2.1
    validations:
      required: true
  - type: input
    id: dart_version
    attributes:
      label: Dart version
      placeholder: Dart 3.x
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, environment notes, or related details if helpful.
