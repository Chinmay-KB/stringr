name: stringr
description: String case conversion (camelCase, snake_case, kebab-case), slugify, remove diacritics (latinize), truncate and count words, with Unicode and grapheme support.
version: 1.3.0
homepage: https://github.com/Chinmay-KB/stringr
repository: https://github.com/Chinmay-KB/stringr
issue_tracker: https://github.com/Chinmay-KB/stringr/issues
topics:
  - string
  - unicode
  - text-processing
  - case-conversion
  - slugify

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  characters: ^1.3.0
dev_dependencies:
  test: ^1.26.3

dependency_overrides:
  file: ^7.0.1
  watcher: ^1.1.2
